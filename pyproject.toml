[project]
name = "txn-data-pipeline"
version = "0.1.0"
description = "Educational financial transaction data pipeline: validation, reconciliation, lineage and idempotent batch processing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Adetlo" }]
dependencies = [
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "polars>=0.20",
  "pandera[polars]>=0.19",
  "pyarrow>=15",
  "structlog>=24.1",
  "duckdb>=1.1",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
txn-pipeline = "txn_pipeline.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pgserver>=0.1.4; sys_platform != 'win32'",
  "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txn_pipeline"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF", "SIM", "DTZ", "T20", "PL"]
ignore = ["RUF012", "PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "DTZ", "PLR"]
"scripts/**" = ["T201", "S101", "E501"]
"migrations/**" = ["I001", "E501"]
"src/txn_pipeline/cli/main.py" = ["E501"]  # Typer option declarations
"src/txn_pipeline/contracts/countries.py" = ["E501"]  # reference data tables

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["txn_pipeline"]

[[tool.mypy.overrides]]
module = ["pgserver", "pgserver.*", "pandera", "pandera.*", "duckdb", "duckdb.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "postgres: tests that require a PostgreSQL database",
  "slow: tests that process larger volumes",
]
filterwarnings = ["error::DeprecationWarning:txn_pipeline.*"]

[tool.coverage.run]
source = ["txn_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
